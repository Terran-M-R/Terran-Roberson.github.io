<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Readiness Portfolio</title>
  
</head>
<body style="background-color: #0a0a0a; background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(144, 224, 239, 0.03) 35px, rgba(144, 224, 239, 0.03) 70px);">
  
  <div class="viewer-container">
    <div class="header">
      <h1>Career Readiness Portfolio</h1>
      <div class="slide-counter">
        Slide <span id="current-slide">1</span> of <span id="total-slides">16</span>
      </div>
    </div>

    <div class="slide-container">
      <div class="slide-wrapper">
        <img src="images/Career Readiness Portfolio.jpg" alt="Slide 1" class="slide active">
        <img src="images/Career Readiness Portfolio (1).jpg" alt="Slide 2" class="slide">
        <img src="images/Career Readiness Portfolio (2).jpg" alt="Slide 3" class="slide">
        <img src="images/Career Readiness Portfolio (3).jpg" alt="Slide 4" class="slide">
        <img src="images/Career Readiness Portfolio (4).jpg" alt="Slide 5" class="slide">
        <img src="images/Career Readiness Portfolio (5).jpg" alt="Slide 6" class="slide">
        <img src="images/Career Readiness Portfolio (6).jpg" alt="Slide 7" class="slide">
        <img src="images/Career Readiness Portfolio (7).jpg" alt="Slide 8" class="slide">
        <img src="images/Career Readiness Portfolio (8).jpg" alt="Slide 9" class="slide">
        <img src="images/Career Readiness Portfolio (9).jpg" alt="Slide 10" class="slide">
        <img src="images/Career Readiness Portfolio (10).jpg" alt="Slide 11" class="slide">
        <img src="images/Career Readiness Portfolio (11).jpg" alt="Slide 12" class="slide">
        <img src="images/Career Readiness Portfolio (12).jpg" alt="Slide 13" class="slide">
        <img src="images/Career Readiness Portfolio (13).jpg" alt="Slide 14" class="slide">
        <img src="images/Career Readiness Portfolio (14).jpg" alt="Slide 15" class="slide">
        <img src="images/Career Readiness Portfolio (15).jpg" alt="Slide 16" class="slide">
      </div>
    </div>

    <div class="controls">
      <button class="nav-button" id="prev-btn" disabled>← Previous</button>
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <button class="nav-button" id="next-btn">Next →</button>
    </div>
  </div>

  <div class="keyboard-hint">
    💡 Tip: Use arrow keys (← →) to navigate
  </div>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const currentSlideSpan = document.getElementById('current-slide');
    const progress = document.getElementById('progress');

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });

      currentSlideSpan.textContent = index + 1;
      
      const progressPercent = ((index + 1) / totalSlides) * 100;
      progress.style.width = progressPercent + '%';

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === totalSlides - 1;
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        showSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        showSlide(currentSlide);
      }
    }

    nextBtn.addEventListener('click', nextSlide);
    prevBtn.addEventListener('click', prevSlide);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    showSlide(0);
  </script>
</body>
</html>
